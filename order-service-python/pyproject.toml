[project]
name = "order-service-python"
version = "0.0.1"
description = "Order service (Python) - Temporal order management workshop"
requires-python = ">=3.10"
dependencies = [
    "temporalio[pydantic]>=1.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
order-service = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
